---
# [archivé 2026-09-07] ingress-nginx a été remplacé par Cilium Gateway API (shared-gateway) :
# plus aucun Ingress n'utilise ingressClassName: nginx, le namespace ingress-nginx n'est plus
# créé (CreateNamespace=false) et la procédure de réinstallation du README ne l'installe plus.
# Conservé pour référence (proxy-real-ip-cidr = CIDR pods Cilium 10.0.0.0/8).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Axtazer/harkesh-k8s
    targetRevision: master
    path: infra/ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
