---
# Crée le Secret "media-share-secrets" depuis le vault 1Password k8s-home.
# À faire dans 1Password AVANT de merger :
#   Vault  : k8s-home
#   Item   : media-share
#   Champs : wg-private-key      → clé privée WireGuard du pod (`wg genkey`)
#            wg-peer-public-key  → clé PUBLIQUE du pair (il te l'envoie)
#            wg-peer-endpoint    → "host:port" du pair (ex. "peer.example.net:51820")
#            wg-preshared-key    → OPTIONNEL (`wg genpsk`). Couche symétrique en plus
#                                  de la crypto asymétrique. Doit être IDENTIQUE des
#                                  deux côtés : une PSK d'un seul côté fait échouer le
#                                  handshake sans message explicite. Ne jamais réutiliser
#                                  la PSK d'un autre tunnel — elle est propre à ce lien.
#
# Pourquoi la clé publique et l'endpoint du pair sont ici et pas en clair dans le
# manifest (contrairement au peer VPS de livekit/livekit.yaml) : le miroir public
# (.github/workflows/mirror-public.yml) ne sanitise que le domaine, l'IP du VPS
# LiveKit et sa clé publique. Tout autre identifiant réseau écrit dans un manifest
# partirait tel quel sur le miroir public.
# Le nom de CETTE ressource détermine le nom du Secret créé par l'opérateur
# (media-share-secrets, réclamé par le volume wg-secret de media-share.yaml).
# L'itemPath ci-dessous désigne l'item côté 1Password, qui porte un autre nom —
# même découplage que livekit-secrets/livekit, matrix-secrets/matrix, etc.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: media-share-secrets
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: "vaults/k8s-home/items/media-share"
