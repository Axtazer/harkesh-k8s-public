---
# metrics-server : API metrics.k8s.io (kubectl top, HPA). Le stack VictoriaMetrics ne la fournit pas.
# --kubelet-insecure-tls : les certificats de service du kubelet kubeadm ne sont pas signés par la CA
# du cluster (pas de serverTLSBootstrap), sinon metrics-server refuse de scraper le nœud.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    chart: metrics-server
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    targetRevision: 3.14.0
    helm:
      values: |
        args:
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
