---
# 1Password Connect + operator (OnePasswordItem → Secrets de tout le cluster). Installé à la main
# (`helm install connect`, opérateur en `latest`) jusqu'ici : cette Application reprend la release
# existante (mêmes noms : release connect, namespace 1password) et épingle les versions par le chart
# (connect-api/connect-sync 1.8.3, operator 1.12.0 pour le chart 2.4.2).
#
# Les deux Secrets d'accès ne sont PAS gérés ici (jamais dans Git) : op-credentials
# (1password-credentials.json) et onepassword-token (token) existent déjà ; sans valeurs
# credentials/token, le chart ne les rend pas et ArgoCD n'y touche pas. Création à la main en cas
# de réinstallation : _docs/reinstallation.md, étape 3.
#
# Sync automatique sans prune (comme argocd/argocd.yaml) : composant dont dépendent tous les
# secrets, une ressource retirée par une montée de chart est supprimée à la main après vérification.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword-connect
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: connect
    repoURL: https://1password.github.io/connect-helm-charts
    targetRevision: 2.4.3
    helm:
      releaseName: connect
      values: |
        operator:
          create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: 1password
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
