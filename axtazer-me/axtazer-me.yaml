---
apiVersion: v1
kind: Namespace
metadata:
  name: axtazer-me
  labels:
    shared-gateway-access: "true"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: axtazer-secrets
  namespace: axtazer-me
spec:
  itemPath: "vaults/k8s-home/items/axtazer-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axtazer-me
  namespace: axtazer-me
  labels:
    app: axtazer-me
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: axtazer-me
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: axtazer-me
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: axtazer-me
          image: ghcr.io/axtazer/axtazer-me:ca5d2ad95de497b6d6efc304644a800c27018732@sha256:322b06d7e05336957d1a67c08bc22320cc89e63d947d88b8811d1fc5e9ac39ab
          ports:
            - containerPort: 8080
          env:
            - name: STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: axtazer-secrets
                  key: steam-api-key
            - name: TZ
              value: Europe/Paris
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: axtazer-me
  namespace: axtazer-me
spec:
  type: ClusterIP
  selector:
    app: axtazer-me
  ports:
    - port: 80
      targetPort: 8080
