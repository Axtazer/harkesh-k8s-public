---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axtazer-me
  namespace: axtazer-me
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system
  hostnames:
    - axtazer.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: axtazer-me
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axtazer-me-tunnel
  namespace: axtazer-me
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: axtazer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: axtazer-me
                port:
                  number: 80
