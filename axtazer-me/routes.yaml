---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axtazer-me-tunnel
  namespace: axtazer-me
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: mydomain2.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: axtazer-me
                port:
                  number: 80
