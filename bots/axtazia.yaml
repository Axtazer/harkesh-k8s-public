---
apiVersion: v1
kind: Namespace
metadata:
  name: bots
  labels:
    shared-gateway-access: "true"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: axtazia-secrets
  namespace: bots
spec:
  itemPath: "vaults/k8s-home/items/axtazia-bot"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axtazia-bot
  namespace: bots
  labels:
    app: axtazia
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: axtazia
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: axtazia
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: bot
          image: ghcr.io/axtazer/axtazia:1b5fca3@sha256:ced9619155b6830929efd58e4e2fbd1021bde44c321b58c9dd8b7c019a49bc70
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: webhook
          envFrom:
            - secretRef:
                name: axtazia-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: axtazia-bot
  namespace: bots
spec:
  selector:
    app: axtazia
  ports:
    - port: 3000
      targetPort: 3000
      name: webhook
  type: ClusterIP
