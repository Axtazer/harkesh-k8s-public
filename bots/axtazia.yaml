---
apiVersion: v1
kind: Namespace
metadata:
  name: bots
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    shared-gateway-access: "true"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: axtazia-secrets
  namespace: bots
spec:
  itemPath: "vaults/k8s-home/items/axtazia-bot"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axtazia-bot
  namespace: bots
  labels:
    app: axtazia
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: axtazia
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: axtazia
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: bot
          image: ghcr.io/axtazer/axtazia:latest@sha256:b00dca41a1fd86ebab0162590cf3d301fe3a614ead4e8543b0a4f2e9ec9a5ae8
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: webhook
          env:
            - name: TZ
              value: Europe/Paris
          envFrom:
            - secretRef:
                name: axtazia-secrets
          # /healthz (serveur webhook) : 200 tant que le client Discord est connecté à la gateway.
          # Seuils larges (10 x 30s = 5 min) : une reconnexion/resume de la gateway ne dure que
          # quelques secondes, on ne redémarre que si le bot reste déconnecté.
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: axtazia-bot
  namespace: bots
spec:
  selector:
    app: axtazia
  ports:
    - port: 3000
      targetPort: 3000
      name: webhook
  type: ClusterIP
