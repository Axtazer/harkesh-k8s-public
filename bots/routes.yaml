---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axtazia-webhook
  namespace: bots
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system
  hostnames:
    - axtazia.axtazer.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook/twitch
        - path:
            type: PathPrefix
            value: /oauth/callback/discord
      backendRefs:
        - name: axtazia-bot
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axtazia-tunnel
  namespace: bots
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: axtazia.axtazer.me
      http:
        paths:
          - path: /webhook/twitch
            pathType: Prefix
            backend:
              service:
                name: axtazia-bot
                port:
                  number: 3000
          - path: /oauth/callback/discord
            pathType: Prefix
            backend:
              service:
                name: axtazia-bot
                port:
                  number: 3000
