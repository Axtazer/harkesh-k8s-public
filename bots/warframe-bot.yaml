---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: warframe-bot-secrets
  namespace: bots
spec:
  itemPath: "vaults/k8s-home/items/warframe-bot"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warframe-bot
  namespace: bots
  labels:
    app: warframe-bot
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: warframe-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: warframe-bot
        ollama-client: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-ollama
          image: curlimages/curl:8.20.0@sha256:b3f1fb2a51d923260350d21b8654bbc607164a987e2f7c84a0ac199a67df812a
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -sf http://ollama.ollama.svc.cluster.local:11434/api/tags > /dev/null; do
                echo "En attente du serveur Ollama..."
                sleep 5
              done
      containers:
        - name: bot
          image: ghcr.io/axtazer/warframe-bot:ee27140@sha256:75d41e69dfaa7e503ee623e808e8f45c666220a2fb81e8e7309bc4d8e9a82765
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: warframe-bot-secrets
          env:
            - name: OLLAMA_HOST
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: OLLAMA_MODEL
              value: warframe-bot
            - name: POSTGRES_HOST
              value: warframe-postgres.bots.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: warframe
            - name: POSTGRES_USER
              value: warframe
            - name: TZ
              value: Europe/Paris
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
