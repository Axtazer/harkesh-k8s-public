apiVersion: batch/v1
kind: CronJob
metadata:
  name: warframe-build-scraper
  namespace: bots
spec:
  schedule: "0 4 * * *"   # 4h du matin chaque nuit
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: scraper
              image: ghcr.io/axtazer/warframe-bot:43409c8@sha256:1d5b5f470463edf3b217fec65fa6dc21dde03d50e0d41b2cd4dc8575f56838f3
              imagePullPolicy: IfNotPresent
              command: ["node", "scripts/scrape-builds.js"]
              envFrom:
                - secretRef:
                    name: warframe-bot-secrets
              env:
                - name: POSTGRES_HOST
                  value: warframe-postgres.bots.svc.cluster.local
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: warframe
                - name: POSTGRES_USER
                  value: warframe
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
