apiVersion: batch/v1
kind: CronJob
metadata:
  name: warframe-build-scraper
  namespace: bots
spec:
  schedule: "0 4 * * *"   # 4h du matin chaque nuit
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: scraper
              image: ghcr.io/axtazer/warframe-bot:0ef0ba3@sha256:364ae59ceb73656ea5814b5a8a90bd04761bdfff2a49b893bf880f22268d79a8
              imagePullPolicy: IfNotPresent
              command: ["node", "scripts/scrape-builds.js"]
              envFrom:
                - secretRef:
                    name: warframe-bot-secrets
              env:
                - name: POSTGRES_HOST
                  value: warframe-postgres.bots.svc.cluster.local
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: warframe
                - name: POSTGRES_USER
                  value: warframe
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
