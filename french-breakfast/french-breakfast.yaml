---
apiVersion: v1
kind: Namespace
metadata:
  name: french-breakfast
  labels:
    shared-gateway-access: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: french-breakfast
  namespace: french-breakfast
  labels:
    app: french-breakfast
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: french-breakfast
  template:
    metadata:
      labels:
        app: french-breakfast
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: french-breakfast
          image: ghcr.io/axtazer/french-breakfast:main@sha256:cf749557c8be4ae9b0bf1671cce530fc7ccb5f433ee50d67b52aa33aed0f0c6e
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Europe/Paris
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: french-breakfast
  namespace: french-breakfast
spec:
  type: ClusterIP
  selector:
    app: french-breakfast
  ports:
    - name: http
      port: 80
      targetPort: http
