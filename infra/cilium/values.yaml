cluster:
  name: kubernetes
hostFirewall:
  devices:
    - enp34s0
  enabled: false
hubble:
  enabled: true
  relay:
    enabled: true
    tls:
      client:
        enabled: false
      enabled: false
  tls:
    enabled: false
  ui:
    enabled: true
operator:
  replicas: 1
routingMode: tunnel
tunnelProtocol: vxlan
gatewayAPI:
  enabled: true
kubeProxyReplacement: true
l2announcements:
  enabled: true
