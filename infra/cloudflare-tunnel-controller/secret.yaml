---
# À créer dans 1Password AVANT de merger :
#   Vault  : k8s-home
#   Item   : cloudflare-tunnel-controller
#   Champs : apiToken    → API token Cloudflare (droits Tunnel:Edit + DNS:Edit)
#            accountId   → Account ID Cloudflare (visible dans le dashboard)
#            tunnelName  → Nom du tunnel existant
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-tunnel-controller
  namespace: cloudflare-tunnel-ingress-controller
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: "vaults/k8s-home/items/cloudflare-tunnel-controller"
