# Drop-in systemd-resolved de harkesh : DoT vers Cloudflare uniquement (cf. _docs/hote.md).
# Installé dans /etc/systemd/resolved.conf.d/ ; nommé 99- pour être lu en dernier.
# Les affectations vides remettent les listes à zéro : tout DNS= / FallbackDNS= d'un fichier
# lu avant (resolved.conf, ancien drop-in Quad9) est ignoré.
# Quad9 a coupé son service en France le 2026-11-24 : plus de DNS hôte, plus de pull d'images.
[Resolve]
DNS=
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
FallbackDNS=
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
DNSOverTLS=yes
DNSSEC=no
