# Drop-in systemd de kubelet : /etc/systemd/system/kubelet.service.d/10-require-mounts.conf
# kubelet ne démarre qu'une fois /mnt/hdd monté. Sans ça (fstab en `nofail`), un HDD absent au boot
# laisse kubelet démarrer : containerd crée des dossiers vides à la place des PV hostPath
# (/mnt/hdd/data/*, /mnt/hdd/cloud_data), MariaDB/Postgres s'initialisent sur une base vide et
# Nextcloud affiche son assistant d'installation sur Internet.
# Contrepartie voulue : HDD absent = cluster arrêté jusqu'à réparation (ou retrait temporaire de ce
# fichier + `systemctl daemon-reload` pour démarrer sans les apps du HDD).
# Installation et vérification : _docs/hote.md, « Configuration initiale ».
[Unit]
RequiresMountsFor=/mnt/hdd
