---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    shared-gateway-access: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: TZ
              value: Europe/Paris
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility  # video = NVENC/NVDEC hardware transcoding
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
              nvidia.com/gpu: "1"  # 1 slice sur 4 (time-slicing géré par argocd/k8s-device-plugin.yaml)
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
              readOnly: true
          # Pas de hostPath /dev/nvidia* : la ressource nvidia.com/gpu ci-dessus fait injecter
          # les devices ET les libs driver (NVENC) par le nvidia-container-runtime. Vérifier après
          # rollout : kubectl exec -n media deploy/jellyfin -- ls /dev/nvidia0 /dev/nvidiactl /dev/nvidia-uvm
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          hostPath:
            path: /srv/jellyfin/config
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: /mnt/hdd/media/files
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: 8096
