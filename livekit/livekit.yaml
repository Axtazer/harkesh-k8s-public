---
apiVersion: v1
kind: Namespace
metadata:
  name: livekit
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    shared-gateway-access: "true"
---
# Secrets requis dans le vault k8s-home, item "livekit" :
#   api-key, api-secret   (partagés entre livekit-server et lk-jwt-service —
#                           générer : openssl rand -hex 16 / openssl rand -hex 32)
#   wg-private-key        (clé privée WireGuard du pod — voir _docs/apps/livekit.md pour la génération
#                           et l'ajout de la clé publique correspondante côté VPS relais)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: livekit-secrets
  namespace: livekit
spec:
  itemPath: "vaults/k8s-home/items/livekit"

---
# config.yaml est un template : __LIVEKIT_API_KEY__/__LIVEKIT_API_SECRET__ sont
# substitués par l'initContainer config-init à partir du secret livekit-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: livekit
data:
  config.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: false
      # IP publique du VPS relais (WireGuard) — c'est elle que LiveKit annonce
      # aux clients comme candidat ICE, pas l'IP interne du pod/cluster.
      node_ip: "203.0.113.10"
    keys:
      __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: livekit
  labels:
    app: livekit
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: livekit
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: livekit
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Injecte l'API key/secret LiveKit dans la config (depuis le secret 1Password)
        - name: config-init
          image: busybox:latest@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              sed \
                -e "s#__LIVEKIT_API_KEY__#${LIVEKIT_API_KEY}#g" \
                -e "s#__LIVEKIT_API_SECRET__#${LIVEKIT_API_SECRET}#g" \
                /template/config.yaml > /data/config.yaml
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: api-secret
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: data
              mountPath: /data
      containers:
        # Sidecar qui monte (et surveille/recrée si besoin) l'interface WireGuard
        # UNIQUEMENT dans le netns de ce pod (pas sur l'hôte harkesh) — relaie le flux
        # média UDP/TCP vers le VPS 203.0.113.10, qui le redirige (DNAT) depuis les
        # ports publics 7881/tcp + 7882/udp.
        # Tourne en continu plutôt qu'en initContainer : Cilium fait un passage de
        # reconfiguration du netns juste après le démarrage du pod qui balaie les
        # interfaces qu'il ne connaît pas — un initContainer qui crée wg0 puis termine
        # se fait donc effacer avant même que le conteneur livekit ne démarre.
        - name: wg-tunnel
          image: lscr.io/linuxserver/wireguard:latest@sha256:7e2e05bf6b8af4e9e4f75d3a2b5b48e9fffca2f0f7c9f225f005ff5805fecab3
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              while true; do
                if ! ip link show wg0 >/dev/null 2>&1; then
                  ip link add wg0 type wireguard
                  ip addr add 10.10.0.2/24 dev wg0
                  wg set wg0 private-key /etc/wg-secret/private-key \
                    peer <wg-public-key> \
                    endpoint 203.0.113.10:51820 \
                    allowed-ips 10.10.0.1/32 \
                    persistent-keepalive 25
                  ip link set mtu 1400 up dev wg0
                fi
                sleep 10
              done
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: wg-secret
              mountPath: /etc/wg-secret
              readOnly: true
        - name: livekit
          image: livekit/livekit-server:v1.13.11@sha256:04668840140552c7e5d7faf28959cbf2256fb04ea641c4fd23ea69cbf3d7d105
          securityContext:
            allowPrivilegeEscalation: false
          args: ["--config", "/data/config.yaml"]
          ports:
            - name: signaling
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
          env:
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7880
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: wg-secret
          secret:
            secretName: livekit-secrets
            items:
              - key: wg-private-key
                path: private-key
        - name: config-template
          configMap:
            name: livekit-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-signaling
  namespace: livekit
spec:
  selector:
    app: livekit
  ports:
    - port: 7880
      targetPort: 7880
