---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit-tunnel
  namespace: livekit
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: livekit.mydomain2.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-signaling
                port:
                  number: 7880
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit-jwt-tunnel
  namespace: livekit
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: livekit-jwt.mydomain2.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lk-jwt-service
                port:
                  number: 8080
