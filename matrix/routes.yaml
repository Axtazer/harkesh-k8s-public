---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
  namespace: matrix
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system
  hostnames:
    - matrix.axtazer.me
  rules:
    # Exact match, priorité sur le PathPrefix "/" ci-dessous (requis par Gateway API :
    # un match exact l'emporte toujours sur un prefix, quel que soit l'ordre déclaré,
    # mais on le met en premier pour la lisibilité)
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/client
      backendRefs:
        - name: matrix-wellknown
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: synapse
          port: 8008
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-tunnel
  namespace: matrix
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: matrix.axtazer.me
      http:
        paths:
          - path: /.well-known/matrix/client
            pathType: Exact
            backend:
              service:
                name: matrix-wellknown
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapse
                port:
                  number: 8008
