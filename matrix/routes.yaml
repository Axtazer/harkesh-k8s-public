---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
  namespace: matrix
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system
  hostnames:
    - matrix.axtazer.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: synapse
          port: 8008
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-tunnel
  namespace: matrix
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: matrix.axtazer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapse
                port:
                  number: 8008
