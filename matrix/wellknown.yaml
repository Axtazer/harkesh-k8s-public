---
# Sert /.well-known/matrix/{client,server} sur matrix.axtazer.me (voir matrix/routes.yaml
# pour les rules qui routent ces chemins ici plutôt que vers Synapse).
#
# client : nécessaire pour qu'Element découvre le service LiveKit (MSC4143 rtc_foci)
#          pour Element Call.
# server : nécessaire pour la découverte fédération standard de Matrix (utilisée par
#          lk-jwt-service pour vérifier les tokens OpenID via
#          /_matrix/federation/v1/openid/userinfo) -- sans ce fichier, les clients de
#          fédération essaient de se connecter en direct sur matrix.axtazer.me:8448
#          (port jamais exposé) au lieu de passer par le port 443 déjà proxié par le
#          Cloudflare Tunnel. "m.server": "...:443" les redirige sur ce port.
# (Ceci ne rouvre PAS la fédération inter-serveurs -- federation_domain_whitelist: []
# dans matrix.yaml continue de la bloquer, cf. commentaire associé.)
#
# nginx (pas busybox httpd) : requis pour ajouter le header CORS
# Access-Control-Allow-Origin, exigé par le spec Matrix -- les clients web (Element)
# fetchent ces endpoints en cross-origin depuis un domaine différent, et le navigateur
# bloque silencieusement la réponse sans ce header (curl, lui, ne le voit pas -- d'où
# un faux positif si on ne teste qu'au curl).
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-wellknown
  namespace: matrix
data:
  client.json: |
    {
      "m.homeserver": {
        "base_url": "https://matrix.axtazer.me"
      },
      "org.matrix.msc4143.rtc_foci": [
        {
          "type": "livekit",
          "livekit_service_url": "https://livekit-jwt.axtazer.me"
        }
      ]
    }
  server.json: |
    {
      "m.server": "matrix.axtazer.me:443"
    }
  nginx.conf: |
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 8080;
        location = /.well-known/matrix/client {
          default_type application/json;
          add_header Access-Control-Allow-Origin * always;
          alias /www/client.json;
        }
        location = /.well-known/matrix/server {
          default_type application/json;
          add_header Access-Control-Allow-Origin * always;
          alias /www/server.json;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-wellknown
  namespace: matrix
  labels:
    app: matrix-wellknown
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: matrix-wellknown
  template:
    metadata:
      labels:
        app: matrix-wellknown
    spec:
      containers:
        - name: nginx
          image: nginx:alpine@sha256:1f25fedd50aec27413031afb3a4f8ee4effcc9d843f6a76e81bfa92245ac5c06
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /www/client.json
              subPath: client.json
            - name: config
              mountPath: /www/server.json
              subPath: server.json
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: matrix-wellknown
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-wellknown
  namespace: matrix
spec:
  selector:
    app: matrix-wellknown
  ports:
    - port: 8080
      targetPort: 8080
