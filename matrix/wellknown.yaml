---
# Sert /.well-known/matrix/client sur matrix.axtazer.me (voir matrix/routes.yaml pour
# le rule qui route ce chemin ici plutôt que vers Synapse). Nécessaire pour qu'Element
# découvre le service LiveKit (MSC4143 rtc_foci) pour Element Call.
#
# nginx (pas busybox httpd) : requis pour ajouter le header CORS
# Access-Control-Allow-Origin, exigé par le spec Matrix -- les clients web (Element)
# fetchent ce endpoint en cross-origin depuis un domaine différent, et le navigateur
# bloque silencieusement la réponse sans ce header (curl, lui, ne le voit pas -- d'où
# un faux positif si on ne teste qu'au curl).
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-wellknown
  namespace: matrix
data:
  client.json: |
    {
      "m.homeserver": {
        "base_url": "https://matrix.axtazer.me"
      },
      "org.matrix.msc4143.rtc_foci": [
        {
          "type": "livekit",
          "livekit_service_url": "https://livekit-jwt.axtazer.me"
        }
      ]
    }
  nginx.conf: |
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 8080;
        location = /.well-known/matrix/client {
          default_type application/json;
          add_header Access-Control-Allow-Origin * always;
          alias /www/client.json;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-wellknown
  namespace: matrix
  labels:
    app: matrix-wellknown
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: matrix-wellknown
  template:
    metadata:
      labels:
        app: matrix-wellknown
    spec:
      containers:
        - name: nginx
          image: nginx:alpine@sha256:1f25fedd50aec27413031afb3a4f8ee4effcc9d843f6a76e81bfa92245ac5c06
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /www/client.json
              subPath: client.json
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: matrix-wellknown
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-wellknown
  namespace: matrix
spec:
  selector:
    app: matrix-wellknown
  ports:
    - port: 8080
      targetPort: 8080
