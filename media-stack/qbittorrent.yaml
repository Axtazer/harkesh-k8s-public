---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      initContainers:
        - name: tun-init
          image: busybox:latest@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ["sh", "-c", "test -c /dev/net/tun && echo 'tun ok' || (mknod /dev/net/tun c 10 200 && echo 'tun created')"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev-net
              mountPath: /dev/net
      containers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:latest@sha256:d180743987bb24da1d749a1d7f3a78026e64ba2d09d2e08cc34b0acee7f7321b
          securityContext:
            capabilities:
              add:
                - "NET_ADMIN"
                - "NET_RAW"
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mullvad-credentials
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: mullvad-credentials
                  key: wireguard-address
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,10.0.0.0/16"
            - name: HEALTH_TARGET_ADDRESSES
              value: "1.1.1.1:443,8.8.8.8:443"
            - name: DNS_SERVER
              value: "enabled"
            - name: DNS_UPSTREAM_RESOLVER_TYPE
              value: "plain"
            - name: DNS_UPSTREAM_PLAIN_ADDRESSES
              value: "100.64.0.3:53"
            - name: TZ
              value: Europe/Paris
            - name: UPDATER_PERIOD
              value: 24h
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: dev-net
              mountPath: /dev/net
          livenessProbe:
            exec:
              command: ["sh", "-c", "wget -qO- https://api.ipify.org || exit 1"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10

        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest@sha256:abbf2aeeb58b641977a012d0ab69939eb277cb827078450b142f782b1cd6893c
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: TZ
              value: Europe/Paris
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: webui
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /movies
            - name: series
              mountPath: /series
            - name: anime
              mountPath: /anime
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: dev-net
          hostPath:
            path: /dev/net
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: /mnt/hdd/media/config/qbittorrent
            type: DirectoryOrCreate
        - name: movies
          hostPath:
            path: /mnt/hdd/media/files/movies
            type: DirectoryOrCreate
        - name: series
          hostPath:
            path: /mnt/hdd/media/files/series
            type: DirectoryOrCreate
        - name: anime
          hostPath:
            path: /mnt/hdd/media/files/anime
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
