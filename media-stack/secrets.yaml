---
# Crée le Secret "mullvad-credentials" depuis le vault 1Password k8s-home.
# À faire dans 1Password AVANT de merger :
#   Vault    : k8s-home
#   Item     : mullvad-credentials
#   Champs   : wireguard-private-key  → ta clé privée WireGuard Mullvad
#              wireguard-address      → IP assignée à ta clé (ex: 10.x.x.x/32)
#              (mullvad.net → Account → WireGuard keys)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: mullvad-credentials
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: "vaults/k8s-home/items/mullvad-credentials"
