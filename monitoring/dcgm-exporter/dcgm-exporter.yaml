---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dcgm-exporter
  namespace: argocd
spec:
  project: default
  source:
    chart: dcgm-exporter
    repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
    targetRevision: 4.8.1
    helm:
      values: |
        service:
          ipFamilies:
            - IPv4
          ipFamilyPolicy: SingleStack
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
