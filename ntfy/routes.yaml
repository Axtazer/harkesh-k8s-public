---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy-tunnel
  namespace: ntfy
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: ntfy.axtazer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
