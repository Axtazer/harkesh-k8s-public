---
# Remplace l'installation manuelle du nvidia-device-plugin
# Gère le time-slicing GPU via ArgoCD + Helm
# Chart: https://nvidia.github.io/k8s-device-plugin
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.17.1
    helm:
      values: |
        config:
          name: nvidia-device-plugin-config
          create: true
          data: |
            version: v1
            sharing:
              timeSlicing:
                replicas: 4
                failRequestsGreaterThanOne: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
