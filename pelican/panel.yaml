---
apiVersion: v1
kind: Namespace
metadata:
  name: pelican
  labels:
    shared-gateway-access: "true"
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-panel
  namespace: pelican
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panel
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: panel
    spec:
      securityContext:
        fsGroup: 82
        fsGroupChangePolicy: Always
      containers:
        - name: panel
          image: ghcr.io/pelican-dev/panel:v1.0.0-beta35@sha256:62edd14e133f9240e00df082f82c720ff93deca488b0c6602e95cc7fb6560abb
          env:
            - name: APP_URL
              value: "https://panel.axtazer.me"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: XDG_DATA_HOME
              value: "/pelican-data"
            - name: BEHIND_PROXY
              value: "true"
            - name: APP_TIMEZONE
              value: "Europe/Paris"
            - name: CADDY_TRUSTED_PROXIES
              value: "trusted_proxies static private_ranges"
          volumeMounts:
            - name: pelican-data
              mountPath: /pelican-data
            - name: pelican-logs
              mountPath: /var/www/html/storage/logs
            - name: pelican-plugins
              mountPath: /var/www/html/plugins
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15   # réduit de 90s → 15s
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30   # réduit de 120s → 30s
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: pelican-data
          persistentVolumeClaim:
            claimName: pelican-data-pvc
        - name: pelican-logs
          emptyDir: {}
        - name: pelican-plugins
          persistentVolumeClaim:
            claimName: pelican-plugins-pvc
---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: pelican-panel-svc
  namespace: pelican
spec:
  selector:
    app: panel
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# --- Wings communication ---
apiVersion: v1
kind: Service
metadata:
  name: wings-internal
  namespace: pelican
spec:
  type: ExternalName
  externalName: wings-svc.wings.svc.cluster.local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelican-data-pvc
  namespace: pelican
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelican-plugins-pvc
  namespace: pelican
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
