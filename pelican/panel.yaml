---
apiVersion: v1
kind: Namespace
metadata:
  name: pelican
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    shared-gateway-access: "true"
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-panel
  namespace: pelican
spec:
  replicas: 1
  # Recreate : la base du panel est en SQLite sur un PVC RWO, et l'image lance ses migrations au
  # démarrage. En RollingUpdate, l'ancien et le nouveau pod tournaient ensemble sur la même base.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: panel
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: panel
    spec:
      automountServiceAccountToken: false
      # Le Panel joint Wings par https://node01.mydomain2.fr:8443 avec un connect timeout de 1 s
      # (DNS inclus). Avec le ndots:5 par défaut, chaque résolution essaie d'abord tous les
      # domaines de recherche (A + AAAA, relayés en DoT par l'hôte sur cache froid) et peut
      # dépasser la seconde → cURL error 28 et 403 Livewire sur la console. ndots:1 résout
      # directement les FQDN ; le Panel n'utilise aucun nom court du cluster.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 82
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: ghcr.io/pelican/panel:v1.0.0-rc.2@sha256:cb717c15da9bcdc93f22a22a02d5460a1ce51fd03f2975b4ce53d745f4cc9ac8
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: APP_URL
              value: "https://panel.mydomain2.fr"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: XDG_DATA_HOME
              value: "/pelican-data"
            - name: BEHIND_PROXY
              value: "true"
            - name: APP_TIMEZONE
              value: "Europe/Paris"
            - name: CADDY_TRUSTED_PROXIES
              value: "trusted_proxies static private_ranges"
            # Laravel : vraie IP client (X-Forwarded-For de cloudflared, pods 10.0.0.0/8) dans
            # l'activité et les sessions, au lieu de l'IP du pod cloudflared. Seuls les pods du
            # cluster joignent le panel (networkpolicy.yaml), l'en-tête n'est pas falsifiable d'Internet.
            - name: TRUSTED_PROXIES
              value: "10.0.0.0/8"
            # Logs Laravel sur stderr → VictoriaLogs (14 j) ; storage/logs est un emptyDir perdu au redémarrage
            - name: LOG_CHANNEL
              value: "stderr"
          volumeMounts:
            - name: pelican-data
              mountPath: /pelican-data
            - name: pelican-logs
              mountPath: /var/www/html/storage/logs
            - name: pelican-plugins
              mountPath: /var/www/html/plugins
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15   # réduit de 90s → 15s
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30   # réduit de 120s → 30s
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: pelican-data
          persistentVolumeClaim:
            claimName: pelican-data-pvc
        - name: pelican-logs
          emptyDir: {}
        - name: pelican-plugins
          persistentVolumeClaim:
            claimName: pelican-plugins-pvc
---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: pelican-panel-svc
  namespace: pelican
spec:
  selector:
    app: panel
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# --- Wings communication ---
apiVersion: v1
kind: Service
metadata:
  name: wings-internal
  namespace: pelican
spec:
  type: ExternalName
  externalName: wings-svc.wings.svc.cluster.local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelican-data-pvc
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  namespace: pelican
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelican-plugins-pvc
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  namespace: pelican
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
