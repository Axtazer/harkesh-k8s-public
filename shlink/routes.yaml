---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shlink
  namespace: shlink
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system
  hostnames:
    - go.axtazer.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shlink
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shlink-web
  namespace: shlink
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system
  hostnames:
    - shlink.axtazer.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shlink-web
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink-tunnel
  namespace: shlink
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: go.axtazer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink
                port:
                  number: 80
    - host: shlink.axtazer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-web
                port:
                  number: 80
