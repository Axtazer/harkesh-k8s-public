---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink-tunnel
  namespace: shlink
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: go.mydomain2.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink
                port:
                  number: 80
    - host: shlink.mydomain2.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-web
                port:
                  number: 80
