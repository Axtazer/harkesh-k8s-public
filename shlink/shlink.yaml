---
apiVersion: v1
kind: Namespace
metadata:
  name: shlink
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: shlink-secrets
  namespace: shlink
spec:
  itemPath: "vaults/k8s-home/items/shlink"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: shlink-db-secret
  namespace: shlink
spec:
  itemPath: "vaults/k8s-home/items/shlink-db"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shlink-db-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/hdd/data/shlink
  claimRef:
    namespace: shlink
    name: shlink-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shlink-db-pvc
  namespace: shlink
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: shlink-db-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shlink
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shlink-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shlink-db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shlink-db-secret
                  key: DB_NAME
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: shlink-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shlink
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink
  namespace: shlink
  labels:
    app: shlink
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: shlink
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: shlink
    spec:
      containers:
        - name: shlink
          image: ghcr.io/shlinkio/shlink:stable@sha256:c1e2b7e7a2375e83e2faa6d8f51d3f707f7eb8abab07c409301f5319ecb6825d
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: shlink-secrets
            - secretRef:
                name: shlink-db-secret
          env:
            - name: DEFAULT_DOMAIN
              value: go.axtazer.me
            - name: IS_HTTPS_ENABLED
              value: "true"
            - name: DB_DRIVER
              value: postgres
            - name: DB_HOST
              value: postgres.shlink.svc.cluster.local
            - name: CORS_ALLOW_ORIGIN
              value: https://shlink.axtazer.me
            - name: SKIP_INITIAL_GEOLITE_DOWNLOAD
              value: "true"
            - name: SHELL_VERBOSITY
              value: "3"
            - name: TZ
              value: Europe/Paris
          readinessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: shlink
  namespace: shlink
spec:
  selector:
    app: shlink
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-web
  namespace: shlink
  labels:
    app: shlink-web
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: shlink-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: shlink-web
    spec:
      containers:
        - name: shlink-web
          image: ghcr.io/shlinkio/shlink-web-client:stable@sha256:acc95a754a52d2a2aa4e74da6f722180e5b209902f0f0aad7cd9df33d4b4fc6f
          ports:
            - containerPort: 8080
          env:
            - name: SHLINK_SERVER_URL
              value: https://go.axtazer.me
            - name: SHLINK_SERVER_NAME
              value: Harkesh
            - name: SHLINK_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shlink-secrets
                  key: INITIAL_API_KEY
            - name: TZ
              value: Europe/Paris
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: shlink-web
  namespace: shlink
spec:
  selector:
    app: shlink-web
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink
  namespace: shlink
spec:
  ingressClassName: nginx
  rules:
    - host: go.axtazer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink
                port:
                  number: 80
    - host: shlink.axtazer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-web
                port:
                  number: 80
