---
apiVersion: v1
kind: Namespace
metadata:
  name: snapp
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: snapp-secrets
  namespace: snapp
spec:
  itemPath: "vaults/k8s-home/items/snapp"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: snapp-db-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/hdd/data/snapp
  claimRef:
    namespace: snapp
    name: snapp-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapp-db-pvc
  namespace: snapp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: snapp-db-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapp
  namespace: snapp
  labels:
    app: snapp
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: snapp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: snapp
    spec:
      containers:
        - name: snapp
          image: uraniadev/snapp:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: snapp-secrets
          env:
            - name: DATABASE_PROVIDER
              value: sqlite
            - name: DATABASE_URL
              value: "file:/app/data/snapp.db"
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: db-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: snapp-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: snapp
  namespace: snapp
spec:
  selector:
    app: snapp
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snapp
  namespace: snapp
spec:
  ingressClassName: nginx
  rules:
    - host: snapp.castaldo.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snapp
                port:
                  number: 80
